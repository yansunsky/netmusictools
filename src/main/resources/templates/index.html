<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音乐上传播放系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* 原有样式保持不变 */
    :root {
      --primary: #4a69bd;
      --primary-hover: #1e3799;
      --accent: #e55039;
      --light-bg: #f8f9fa;
      --dark-text: #2c3e50;
      --border: #e0e6ed;
    }

    body {
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e7f1 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .music-app {
      max-width: 800px;
      margin: 0 auto;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border);
    }

    .app-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--dark-text);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-title i {
      color: var(--primary);
      font-size: 28px;
    }

    .user-section {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .welcome-text {
      font-size: 16px;
      color: var(--dark-text);
      font-weight: 500;
    }

    .username {
      font-weight: 600;
      color: var(--primary);
    }

    .logout-btn {
      padding: 8px 15px;
      background-color: var(--light-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--accent);
      font-weight: 500;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .logout-btn:hover {
      background-color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      color: var(--accent);
    }

    .card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      margin-bottom: 30px;
      background-color: #fff;
    }

    .card-header {
      background-color: #fff;
      padding: 20px 25px;
      border-bottom: 1px solid var(--border);
      font-size: 18px;
      font-weight: 600;
      color: var(--dark-text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-body {
      padding: 25px;
    }

    .upload-icon {
      font-size: 24px;
      color: var(--primary);
    }

    .file-info {
      background-color: var(--light-bg);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .file-info p {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
    }

    .file-label {
      font-weight: 600;
      min-width: 80px;
      color: var(--dark-text);
    }

    .link-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .link-input {
      flex: 1;
      background-color: #fff;
      border: 1px solid var(--border);
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-wrapper {
      background-color: #f1f8fe;
      border-radius: 10px;
      padding: 20px;
      margin-top: 30px;
      text-align: center;
    }

    audio {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      display: block;
    }

    .btn-primary {
      background-color: var(--primary);
      border-color: var(--primary);
      padding: 12px 24px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .btn-primary:hover, .btn-primary:focus {
      background-color: var(--primary-hover);
      border-color: var(--primary-hover);
      box-shadow: 0 4px 10px rgba(74, 105, 189, 0.3);
    }

    .btn-outline-secondary {
      border-color: var(--border);
      color: #6c757d;
      transition: all 0.3s ease;
    }

    .btn-outline-secondary:hover {
      background-color: var(--light-bg);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 5px solid var(--border);
      border-top: 5px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<div class="music-app">
  <!-- 头部区域 -->
  <header class="app-header">
    <div class="app-title">
      <i>🎵</i>
      <span>音乐上传播放系统</span>
    </div>
    <div class="user-section">
      <div class="welcome-text">
        欢迎回来，<span class="username" id="userName"></span>！
      </div>
      <a href="#" class="logout-btn" id="logoutBtn">
        <i>➡️</i>
        <span>退出</span>
      </a>
    </div>
  </header>

  <!-- 上传区域 -->
  <div id="uploadSection" class="card">
    <div class="card-header">
      <i class="upload-icon">📤</i>
      <span>上传音乐</span>
    </div>
    <div class="card-body">
      <!-- 消息展示 -->
      <div id="messageArea">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
      </div>

      <form id="uploadForm" method="post" action="/api/music/upload" enctype="multipart/form-data">
        <div class="mb-3">
          <label for="fileInput" class="form-label">选择音频文件 (仅支持 MP3 格式)</label>
          <input class="form-control" type="file" id="fileInput" name="file" accept="audio/mp3" required>
        </div>
        <div class="mb-3 form-text text-muted">文件大小不能超过10MB</div>
        <button type="submit" class="btn btn-primary w-100 py-3">
          <i>⏫</i>
          <span>上传音乐</span>
        </button>
      </form>
      <!-- 新增查看列表按钮 -->
      <div class="mt-4">
        <a href="/api/music/musicList" class="btn btn-primary">
          <i>📋</i>
          <span>查看音乐列表</span>
        </a>
      </div>
    </div>
  </div>

  <!-- 播放区域（根据后端数据动态显示） -->
  <div id="audioSection" class="card" th:if="${fileName != null}">
    <div class="card-header">
      <i>🎵</i>
      <span>音乐播放器</span>
    </div>
    <div class="card-body">
      <!-- 文件信息 -->
      <div class="file-info">
        <p>
          <span class="file-label">文件名:</span>
          <span th:text="${fileName}"></span>
        </p>
        <p>
          <span class="file-label">时长（秒）:</span>
          <span class="duration" th:text="${musicTime}"></span>
        </p>
        <p>
          <span class="file-label">直链地址:</span>
          <span class="link-row">
            <input type="text" id="audioLink" class="link-input" th:value="${downloadUrl}" readonly>
            <button id="copyBtn" class="btn btn-outline-secondary">
              <i>📋</i>
              <span>复制</span>
            </button>
          </span>
        </p>
      </div>

      <!-- 播放器 -->
      <div class="player-wrapper">
        <audio controls id="audioPlayer" th:src="${playUrl}">
          您的浏览器不支持音频播放功能
        </audio>
      </div>
    </div>
  </div>

  <!-- 加载动画 -->
  <div id="loadingOverlay" class="loading-overlay" style="display: none;">
    <div class="spinner"></div>
  </div>

  <!-- 通知提示（已整合到messageArea） -->
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // 获取用户名的Cookie（与后端逻辑一致）
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      return parts.length === 2 ? parts.pop().split(';').shift() : null;
    }

    // 显示加载动画
    function showLoading() {
      document.getElementById('loadingOverlay').style.display = 'flex';
    }

    // 隐藏加载动画
    function hideLoading() {
      document.getElementById('loadingOverlay').style.display = 'none';
    }

    // 退出登录处理
    document.getElementById('logoutBtn').addEventListener('click', function(e) {
      e.preventDefault();
      document.cookie = 'userName=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
      showToast('已退出登录');
      setTimeout(() => window.location.href = '/login', 1500);
    });

    // 复制链接功能
    document.getElementById('copyBtn').addEventListener('click', function() {
      const audioLink = document.getElementById('audioLink');
      if (audioLink.value) {
        audioLink.select();
        document.execCommand('copy');
        showToast('链接已复制到剪贴板');
      }
    });

    // 上传表单提交监听（显示加载动画）
    document.getElementById('uploadForm').addEventListener('submit', function(e) {
      e.preventDefault(); // 阻止默认提交（用于演示加载效果，实际使用时可移除）
      showLoading();
      setTimeout(() => {
        this.submit(); // 实际使用时直接提交表单即可，无需setTimeout
      }, 500);
    });

    // 通用提示函数
    function showToast(message, isSuccess = true) {
      const toast = document.createElement('div');
      toast.className = `toast align-items-center text-bg-${isSuccess ? 'success' : 'danger'} border-0 show`;
      toast.setAttribute('role', 'alert');
      toast.innerHTML = `
        <div class="d-flex">
          <div class="toast-body">
            ${message}
          </div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      `;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }
  });

  // DOM加载完成后执行
  document.addEventListener('DOMContentLoaded', function() {
    // 获取用户名的Cookie
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
      return null;
    }
    const userName = getCookie('userName');
    document.getElementById('userName').textContent = userName;

  })
</script>
<!-- 引入Bootstrap JS（可选，用于提示框动画） -->
<script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
