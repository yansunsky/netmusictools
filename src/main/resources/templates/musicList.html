<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音乐列表 - 音乐上传播放系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* 复用 index.html 的样式变量 */
    :root {
      --primary: #4a69bd;
      --primary-hover: #1e3799;
      --accent: #e55039;
      --light-bg: #f8f9fa;
      --dark-text: #2c3e50;
      --border: #e0e6ed;
    }

    body {
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e7f1 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .music-app {
      max-width: 1200px;
      margin: 0 auto;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border);
    }

    .app-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--dark-text);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-title i {
      color: var(--primary);
      font-size: 28px;
    }

    .search-section {
      margin-bottom: 20px;
    }

    .search-input {
      max-width: 400px;
      background-color: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 15px;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border-color: var(--primary);
    }

    .table {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
      background-color: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
    }

    .table thead {
      background-color: #fff;
      border-bottom: 1px solid var(--border);
    }

    .table th {
      font-size: 16px;
      font-weight: 600;
      color: var(--dark-text);
      padding: 15px;
      text-align: left;
    }

    .table td {
      padding: 15px;
      vertical-align: middle;
      border-bottom: 1px solid var(--border);
    }

    .table tr:last-child td {
      border-bottom: none;
    }

    .duration {
      color: #6c757d;
      font-size: 14px;
    }

    .url {
      color: #2c3e50;
      font-size: 14px;
      word-break: break-all; /* 长URL自动换行 */
    }

    .copy-btn {
      background-color: var(--light-bg);
      color: var(--dark-text);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      transition: all 0.3s ease;
    }

    .copy-btn:hover {
      background-color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .empty-list {
      text-align: center;
      padding: 40px 0;
      color: #6c757d;
    }

    .empty-list i {
      font-size: 48px;
      margin-bottom: 15px;
      color: var(--border);
    }
    .skeleton-container {
      padding: 20px;
    }
    .skeleton-table {
      width: 100%;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
    }
    .skeleton-row {
      display: flex;
      padding: 15px;
      border-bottom: 1px solid var(--border);
    }
    .skeleton-row:last-child {
      border-bottom: none;
    }
    .skeleton-cell {
      height: 20px;
      background: #f0f0f0;
      border-radius: 4px;
      animation: skeleton-loading 1.5s infinite;
    }
    @keyframes skeleton-loading {
      0% { background-color: #f0f0f0; }
      50% { background-color: #e0e0e0; }
      100% { background-color: #f0f0f0; }
    }
    .btn-success {
      background-color: #28a745 !important;
      border-color: #28a745 !important;
      color: white !important;
    }
  </style>
</head>
<body>
<div class="music-app">
  <!-- 头部区域 -->
  <header class="app-header">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-6">
          <div class="app-title">
            <i>🎵</i>
            <span>音乐列表</span>
          </div>
        </div>
        <div class="col-md-6 text-md-end">
          <div class="user-section">
            <div class="welcome-text">
              欢迎回来，<span class="username" id="userName"></span>！
            </div>
            <a href="#" class="logout-btn" id="logoutBtn">
              <i>➡️</i>
              <span>退出</span>
            </a>
          </div>
          <div class="mt-3 text-md-end">
            <a href="/" class="btn btn-primary">
              <i>⬅️</i>
              <span>返回上传界面</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 搜索和列表区域 -->
  <div class="card">
    <div class="card-body">
      <!-- 搜索区域 -->
      <div class="search-section mb-4">
        <div class="container">
          <form id="searchForm" method="get" action="/api/music/musicList" class="d-flex flex-wrap gap-2">
            <input type="text"
                   id="keyword"
                   name="keyword"
                   class="form-control search-input flex-grow-1"
                   placeholder="搜索文件名或上传用户..."
                   th:value="${keyword}"
                   @input="debounceSearch(300)"> <!-- 防抖300ms -->
            <button type="submit" class="btn btn-primary">
              <i>🔍</i>
              <span>搜索</span>
            </button>
          </form>
        </div>
      </div>

      <!-- 加载动画 -->
      <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="skeleton-container">
          <div class="skeleton-table">
            <!-- 模拟表格行 -->
            <div class="skeleton-row">
              <div class="skeleton-cell" style="width: 80px;"></div>
              <div class="skeleton-cell" style="width: 200px;"></div>
              <div class="skeleton-cell" style="width: 150px;"></div>
              <div class="skeleton-cell" style="width: 100px;"></div>
              <div class="skeleton-cell" style="width: 250px;"></div>
            </div>
            <div class="skeleton-row">
              <div class="skeleton-cell" style="width: 80px;"></div>
              <div class="skeleton-cell" style="width: 200px;"></div>
              <div class="skeleton-cell" style="width: 150px;"></div>
              <div class="skeleton-cell" style="width: 100px;"></div>
              <div class="skeleton-cell" style="width: 250px;"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 数据列表 -->
      <div id="listContainer">
        <!-- 动态加载数据（Thymeleaf 渲染） -->
        <div th:if="${musicList == null || musicList.isEmpty()}">
          <div class="empty-list">
            <i>🎶</i>
            <p>暂无音乐数据</p>
          </div>
        </div>

        <table th:if="${not #lists.isEmpty(musicList)}" class="table">
          <thead>
          <tr>
            <th>ID</th>
            <th>音乐名</th>
            <th>上传用户</th>
            <th>时长</th>
            <th>URL</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="music : ${musicList}">
            <td th:text="${music.id}"></td>
            <td th:text="${music.musicName}"></td> <!-- 对应实体类的musicName -->
            <td th:text="${music.userName}"></td> <!-- 对应实体类的userName -->
            <td class="duration"
                th:text="${#numbers.formatInteger(music.durationSec, 0)} ?: '未知'">
            </td>
            <td class="actions">
              <!-- 播放按钮 -->
              <a th:href="${music.filePath}"
                 target="_blank"
                 class="btn btn-sm btn-primary me-2">
                <i class="bi bi-play-fill">🎧</i> 播放
              </a>

              <!-- 复制按钮 -->
              <button class="btn btn-sm btn-outline-secondary copy-btn"
                      th:data-url="${baseUrl} + ${music.filePath}">
                <i class="bi bi-clipboard">📋</i> 复制
              </button>
            </td>
          </tr>
          </tbody>
        </table>
      </div>

      <!-- 分页控件 -->
      <!-- 分页控件 - 已修复 -->
      <div th:if="${totalPages > 1}" class="pagination justify-content-center mt-4">
        <ul class="pagination">
          <!-- 上一页 -->
          <li class="page-item" th:classappend="${currentPage <= 1} ? 'disabled' : ''">
            <th:block th:if="${currentPage > 1}">
              <a class="page-link"
                 th:href="@{/api/music/musicList(keyword=${keyword}, page=${currentPage - 2}, size=${size})}"
                 aria-label="上一页">
                <span aria-hidden="true">&laquo; 上一页</span>
              </a>
            </th:block>
            <th:block th:unless="${currentPage > 1}">
        <span class="page-link" aria-disabled="true">
          <span aria-hidden="true">&laquo; 上一页</span>
        </span>
            </th:block>
          </li>

          <!-- 页码计算部分（关键修复） -->
          <th:block>
            <th:block th:with="
          startPage = ${T(java.lang.Math).max(1, currentPage - 2)},
          endPage = ${T(java.lang.Math).min(totalPages, currentPage + 2)}">

              <li class="page-item" th:if="${startPage > 1}">
                <a class="page-link"
                   th:href="@{/api/music/musicList(keyword=${keyword}, page=1, size=${size})}">1</a>
              </li>
              <li class="page-item disabled" th:if="${startPage > 2}">
                <span class="page-link">...</span>
              </li>

              <li class="page-item"
                  th:each="i : ${#numbers.sequence(startPage, endPage)}"
                  th:classappend="${currentPage == i} ? 'active' : ''">
                <a class="page-link"
                   th:href="@{/api/music/musicList(keyword=${keyword}, page=${i}-1, size=${size})}"
                   th:text="${i}"></a>
              </li>

              <li class="page-item disabled" th:if="${endPage < totalPages - 1}">
                <span class="page-link">...</span>
              </li>
              <li class="page-item" th:if="${endPage < totalPages}">
                <a class="page-link"
                   th:href="@{/api/music/musicList(keyword=${keyword}, page=${totalPages}, size=${size})}"
                   th:text="${totalPages}"></a>
              </li>
            </th:block>
          </th:block>

          <!-- 下一页 -->
          <li class="page-item" th:classappend="${currentPage >= totalPages} ? 'disabled' : ''">
            <a th:if="${currentPage < totalPages}"
               class="page-link"
               th:href="@{/api/music/musicList(keyword=${keyword}, page=${currentPage}, size=${size})}"
               aria-label="下一页">
              <span aria-hidden="true">下一页 &raquo;</span>
            </a>
            <span th:unless="${currentPage < totalPages}"
                  class="page-link"
                  aria-disabled="true">
        <span aria-hidden="true">下一页 &raquo;</span>
      </span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // 获取用户名的Cookie（与后端逻辑一致）
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      return parts.length === 2 ? parts.pop().split(';').shift() : null;
    }

    // 显示加载动画
    function showLoading() {
      document.getElementById('loadingOverlay').style.display = 'flex';
    }

    // 隐藏加载动画
    function hideLoading() {
      document.getElementById('loadingOverlay').style.display = 'none';
    }

    // 退出登录处理
    document.getElementById('logoutBtn').addEventListener('click', function(e) {
      e.preventDefault();
      document.cookie = 'userName=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
      showToast('已退出登录');
      setTimeout(() => window.location.href = '/login', 1500);
    });

    // 复制链接功能
    function copyUrl(url) {
      navigator.clipboard.writeText(url).then(() => {
        showToast('链接已复制到剪贴板');
      }).catch(() => {
        showToast('复制失败，请手动复制');
      });
    }

    // 搜索表单提交（显示加载动画）
    document.getElementById('searchForm').addEventListener('submit', function(e) {
      e.preventDefault(); // 阻止默认提交（用于演示加载效果，实际使用时可移除）
      showLoading();
      setTimeout(() => {
        this.submit(); // 实际使用时直接提交表单即可，无需setTimeout
      }, 500);
    });

    // 通用提示函数
    function showToast(message, isSuccess = true) {
      const toast = document.createElement('div');
      toast.className = `toast align-items-center text-bg-${isSuccess ? 'success' : 'danger'} border-0 show`;
      toast.setAttribute('role', 'alert');
      toast.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">
                        ${message}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // 初始化时显示加载动画（模拟数据加载）
    showLoading();
    setTimeout(hideLoading, 800); // 实际项目中应等待接口返回数据后隐藏
  });
  // DOM加载完成后执行
  document.addEventListener('DOMContentLoaded', function() {
    // 获取用户名的Cookie
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
      return null;
    }
    document.getElementById('userName').textContent = getCookie('userName');

  })

  document.querySelectorAll('.copy-btn').forEach(button => {
    button.addEventListener('click', () => {
      const url = button.dataset.url;
      copyToClipboard(url);

      // 添加视觉反馈
      const originalHtml = button.innerHTML;
      button.innerHTML = '<i class="bi bi-check"></i> 已复制';
      button.classList.add('btn-success');

      // 2秒后恢复原始状态
      setTimeout(() => {
        button.innerHTML = originalHtml;
        button.classList.remove('btn-success');
      }, 2000);
    });
  });

  // 复制到剪贴板的函数
  function copyToClipboard(text) {
    // 创建临时textarea
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.setAttribute('readonly', '');
    textarea.style.position = 'absolute';
    textarea.style.left = '-9999px';
    document.body.appendChild(textarea);

    // 选择并复制
    textarea.select();
    document.execCommand('copy');

    // 清理
    document.body.removeChild(textarea);
  }
</script>

<!-- 引入Bootstrap JS（可选，用于提示框动画） -->
<script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
